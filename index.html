<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin the Wheel</title>
<style>
  :root{
    --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb; --panel:#ffffff; --page:#f3f4f8; --accent:#4f46e5;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--page)}
  .app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;max-width:1200px;margin:0 auto;padding:20px}
  @media(max-width:900px){.app{grid-template-columns:1fr}}
  .stage{border-radius:18px;padding:24px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:background .2s}
  .stage h1{margin:0;font-size:clamp(24px,4vw,38px);text-align:center;letter-spacing:.2px;word-break:break-word}
  .wheelwrap{position:relative;width:min(560px,100%);aspect-ratio:1}
  canvas{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #111;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
  .spinbtn{font:inherit;font-size:18px;font-weight:700;padding:14px 48px;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(79,70,229,.35)}
  .spinbtn:disabled{opacity:.5;cursor:not-allowed}
  .spinbtn:not(:disabled):hover{filter:brightness(1.08)}
  .status{min-height:1.2em;font-size:13px;text-align:center;max-width:520px;opacity:.8}
  .panel{background:var(--panel);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);align-self:start}
  .panel h2{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .panel h2.first{margin-top:0}
  .who{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  label.field{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
  input[type=text],input[type=number],input[type=email],input[type=password]{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;background:#fff}
  input[type=range]{width:100%}
  input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;flex:none}
  .row2{display:flex;gap:12px}
  .row2>*{flex:1}
  .colorfield{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .speedlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .prize{display:grid;grid-template-columns:34px 34px 1fr 70px 26px;gap:8px;align-items:center;margin-bottom:8px}
  .prize.empty input[type=text]{opacity:.5}
  .pct{grid-column:3 / 6;font-size:12px;color:var(--muted);margin-top:-4px;padding-left:2px}
  .x{border:0;background:none;color:#9ca3af;font-size:20px;cursor:pointer;line-height:1}
  .x:hover{color:#dc2626}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink)}
  .btn:hover{background:#f9fafb}
  .check{display:flex;gap:8px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
  .check input{margin-top:3px;width:16px;height:16px;flex:none}
  .total{font-size:13px;color:var(--muted);margin:2px 0 10px}
  [inert]{opacity:.55;pointer-events:none}
  .app.nopanel{grid-template-columns:1fr}
  .app.nopanel .panel{display:none}
  .app.nopanel .wheelwrap{width:min(78vh,720px,100%)}
  .gear{position:fixed;top:12px;right:12px;z-index:5;font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .gear:hover{background:#f9fafb}
  .gear.faint{opacity:.35;padding:7px 10px}
  .gear.faint:hover{opacity:1}
  .overlay{position:fixed;inset:0;background:rgba(15,18,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:20px;padding:28px 26px;width:min(420px,100%);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .22s ease-out}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .modal .small{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
  .modal .win{font-size:32px;font-weight:800;margin:8px 0 4px;word-break:break-word}
  .modal .left{color:var(--muted);margin-bottom:20px}
  .modal input[type=email],.modal input[type=password]{margin-top:10px}
  .err{color:#dc2626;font-size:13px;min-height:1.2em;margin:8px 0}
  .swatch{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .modal .btn{display:block;width:100%;padding:12px;font-size:15px;margin-top:8px}
  .modal .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .modal .btn.primary:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<button class="gear" id="gear"></button>
<div class="app" id="app">
  <section class="stage" id="stage">
    <h1 id="title"></h1>
    <div class="wheelwrap">
      <div class="pointer"></div>
      <canvas id="wheel"></canvas>
    </div>
    <button class="spinbtn" id="spin">SPIN</button>
    <div class="status" id="status"></div>
  </section>

  <aside class="panel" id="panel">
    <div class="who" id="who"></div>

    <h2 class="first">Wheel</h2>
    <label class="field">Wheel name
      <input type="text" id="name">
    </label>
    <label class="field">Spin speed
      <input type="range" id="speed" min="1" max="10" step="1">
      <div class="speedlbl"><span>Slow</span><span>Fast</span></div>
    </label>
    <div class="row2">
      <label class="colorfield"><input type="color" id="bg"> Background</label>
      <label class="colorfield"><input type="color" id="txt"> Label text (all)</label>
    </div>
    <label class="field" style="margin-top:12px">Label size
      <input type="range" id="fontScale" min="50" max="200" step="5">
      <div class="speedlbl"><span>Smaller</span><span>Larger</span></div>
    </label>
    <label class="check"><input type="checkbox" id="autoRemove"> Automatically remove one of a prize after it's won</label>
    <label class="check"><input type="checkbox" id="equalSlices"> Equal-size slices (bigger prizes get more slices; odds still follow the counts)</label>

    <h2>Prizes</h2>
    <div class="total" id="total"></div>
    <div id="prizes"></div>
    <div class="btns">
      <button class="btn" id="add">+ Add prize</button>
      <button class="btn" id="shuffle">Shuffle colours</button>
      <button class="btn" id="restock">Reset counts</button>
    </div>

    <h2>Save &amp; load</h2>
    <div class="btns" style="margin-top:0">
      <button class="btn" id="saveFile">Save to file</button>
      <button class="btn" id="loadFile">Load from file</button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </div>
    <div class="total" id="fileMsg" style="margin-top:8px"></div>
  </aside>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="small">The wheel says</div>
    <div class="win" id="winName"></div>
    <div class="left" id="winLeft"></div>
    <button class="btn primary" id="keep">OK</button>
  </div>
</div>

<div class="overlay" id="loginOv">
  <form class="modal" id="loginForm">
    <div class="small">Admin sign-in</div>
    <input type="email" id="lemail" placeholder="Email" autocomplete="username" required>
    <input type="password" id="lpass" placeholder="Password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="btn primary" type="submit" style="margin-top:0">Sign in</button>
    <button class="btn" type="button" id="lcancel">Cancel</button>
  </form>
</div>

<script>
(function(){
  'use strict';
  const TAU = Math.PI * 2;
  const KEY = 'spin-wheel-v2', UIKEY = 'spin-wheel-ui';

  /* ---------- shared database (Firebase) ---------- */
  const USE_FIREBASE = true;           // false = always run on this device only
  const FB_VER = '10.12.2';
  const FB_CONFIG = {
    apiKey: "AIzaSyAHAthkCD_hLogA7EVWPHeklvn_pBXSlnc",
    authDomain: "gross-wheel.firebaseapp.com",
    databaseURL: "https://gross-wheel-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "gross-wheel",
    storageBucket: "gross-wheel.firebasestorage.app",
    messagingSenderId: "1045876079798",
    appId: "1:1045876079798:web:dafabdb9a4b01282593a17"
  };

  const PALETTE = ['#e63946','#f4a261','#2a9d8f','#457b9d','#8e44ad','#e9c46a','#06a77d','#d1495b','#3d5a80','#ef8354','#6a4c93','#1b998b'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const uid = () => Math.random().toString(36).slice(2,9);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const hex = c => /^#[0-9a-f]{6}$/i.test(c) ? c : null;
  const clampN = (n, lo, hi, def) => { n = Number(n); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };

  const defaults = () => ({
    name: 'G.R.O.S.S.',
    speed: 6,
    bg: '#ffffff',
    txt: '#ffffff',
    autoRemove: true,
    equalSlices: false,
    fontScale: 100,
    prizes: [
      {id:uid(), name:'NTUC Voucher',      count:26,  start:26,  color:'#ff0000'},
      {id:uid(), name:'Bluetooth speaker', count:75,  start:75,  color:'#ff33ff'},
      {id:uid(), name:'Luggage covers',    count:250, start:250, color:'#3333ff'},
      {id:uid(), name:'Foldable bags',     count:380, start:380, color:'#66b3ff'}
    ]
  });

  let state = {name:'', speed:6, bg:'#ffffff', txt:'#ffffff', autoRemove:true, equalSlices:false, fontScale:100, prizes:[]};
  let mode = 'loading';                // loading | shared | local
  let isAdmin = false, fb = null, user = null, notice = '';
  let remoteCfg = null, remoteCounts = {}, gotCfg = false, cfgApplied = false, writeTimer = null;
  let rotation = 0, spinning = false, winnerId = null, spinSegs = null, uiHide = false;

  const canvas = $('wheel'), ctx = canvas.getContext('2d');

  /* ---------- local storage (local mode + UI preference) ---------- */
  function loadLocal(){
    try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.prizes)) return s; }catch(e){}
    return null;
  }
  function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function loadUI(){ try{ uiHide = !!JSON.parse(localStorage.getItem(UIKEY)).hide; }catch(e){} }
  function saveUI(){ try{ localStorage.setItem(UIKEY, JSON.stringify({hide:uiHide})); }catch(e){} }

  /* ---------- helpers ---------- */
  function lum(h){
    const n = parseInt(h.slice(1),16);
    return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255))/255;
  }
  const active = () => state.prizes.filter(p => p.count > 0);
  const totalCount = () => active().reduce((s,p)=>s+p.count,0);
  const setStatus = t => { $('status').textContent = t || ''; };

  // The wheel's slices, in order: [{p: prize, frac: share of the wheel}].
  // Odds always follow the counts; equalSlices only changes how the wheel looks:
  // every slice is the size of the smallest prize, and bigger prizes get
  // proportionally more slices, spread evenly around the wheel.
  function buildSegments(list, total){
    if(!state.equalSlices || list.length < 2) return list.map(p => ({p, frac: p.count/total}));
    const CAP = 60;
    const unit = Math.max(Math.min(...list.map(p => p.count)), total/CAP);
    const items = [];
    list.forEach((p, pi) => {
      const k = Math.max(1, Math.round(p.count/unit));
      for(let j = 0; j < k; j++) items.push({p, pi, pos:(j+0.5)/k});
    });
    items.sort((a,b) => a.pos - b.pos || a.pi - b.pi);
    return items.map(it => ({p: it.p, frac: 1/items.length}));
  }

  function emptyMsg(){
    if(mode === 'loading') return 'Loading…';
    if(mode === 'shared' && !remoteCfg) return 'Not set up yet';
    return 'No prizes left';
  }

  /* ---------- drawing ---------- */
  function draw(){
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    if(!size) return;
    canvas.width = size*dpr; canvas.height = size*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,size,size);
    const cx = size/2, cy = size/2, r = size/2 - 8;
    const total = totalCount();
    const segs = spinSegs || (total ? buildSegments(active(), total) : []);

    ctx.beginPath(); ctx.arc(cx,cy,r+6,0,TAU); ctx.fillStyle='#1f2430'; ctx.fill();

    if(!segs.length){
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fillStyle='#d1d5db'; ctx.fill();
      ctx.fillStyle='#4b5563'; ctx.font='600 22px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(emptyMsg(), cx, cy);
      return;
    }

    let a = rotation;
    segs.forEach(seg => {
      const p = seg.p, sweep = seg.frac*TAU;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,a,a+sweep); ctx.closePath();
      ctx.fillStyle = p.color; ctx.fill();
      if(segs.length > 1){ ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke(); }

      const arcLen = sweep * r * 0.55;
      if(arcLen > 12){
        ctx.save();
        ctx.translate(cx,cy); ctx.rotate(a + sweep/2);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillStyle = p.txt || state.txt;
        const base = Math.min(26, Math.max(9, arcLen*0.7));
        let fs = Math.min(base*(state.fontScale||100)/100, Math.max(base, sweep*r*0.6));
        const maxW = r*0.72;
        ctx.font = `700 ${fs}px system-ui,sans-serif`;
        while(ctx.measureText(p.name).width > maxW && fs > 8){ fs -= 1; ctx.font = `700 ${fs}px system-ui,sans-serif`; }
        ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 3;
        ctx.fillText(p.name, r - 16, 0);
        ctx.restore();
      }
      a += sweep;
    });

    ctx.beginPath(); ctx.arc(cx,cy,r*0.07,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#1f2430'; ctx.stroke();
  }

  /* ---------- spinning ---------- */
  const spinDuration = () => 1.6 + (10 - state.speed) * 0.85;   // seconds

  function pickWeighted(){
    const list = active(), total = totalCount();
    if(!total) return null;
    let roll = Math.random()*total;
    for(const p of list){ if(roll < p.count) return p; roll -= p.count; }
    return list[list.length-1];
  }

  // Decide the winner and take one off the stock. Returns the prize id (or null).
  async function claim(){
    if(mode !== 'shared'){
      const p = pickWeighted();
      if(!p) return null;
      if(state.autoRemove !== false){ p.count--; saveLocal(); renderPrizes(); }
      return p.id;
    }
    // Shared: the decrement is an atomic transaction, so two devices can never both take the last one.
    for(let i = 0; i < 6; i++){
      const p = pickWeighted();
      if(!p) return null;
      if(state.autoRemove === false) return p.id;
      const r = await fb.runTransaction(fb.ref(fb.db, 'wheel/counts/' + p.id),
        cur => (typeof cur === 'number' && cur > 0) ? cur - 1 : undefined);
      if(r.committed) return p.id;
      await sleep(200);                 // stock changed under us; pick again with fresh numbers
    }
    return null;
  }

  async function spin(){
    if(spinning || !totalCount()) return;
    spinning = true; setStatus('');
    $('spin').disabled = true; $('panel').setAttribute('inert','');
    const pre = {};
    state.prizes.forEach(p => { pre[p.id] = p.count; });

    let id = null, failed = null;
    try{ id = await claim(); }catch(e){ failed = e; console.warn(e); }
    if(!id){
      spinning = false; $('panel').removeAttribute('inert');
      setStatus(failed ? 'Couldn’t record the spin: ' + (failed.message || failed) : 'Couldn’t reach the shared wheel. Please try again.');
      updateSpin(); return;
    }
    winnerId = id;

    // Freeze the wheel as it looked when the spin started, so other devices' wins don't redraw it mid-spin.
    const frozen = state.prizes.map(p => ({...p, count: Math.max(0, pre[p.id]||0)})).filter(p => p.count > 0);
    if(!frozen.some(p => p.id === id)){ const w = state.prizes.find(p => p.id === id); if(w) frozen.push({...w, count:1}); }
    spinSegs = buildSegments(frozen, frozen.reduce((s,p)=>s+p.count,0));

    const mine = [];
    spinSegs.forEach((s,i) => { if(s.p.id === id) mine.push(i); });
    const chosen = mine[Math.floor(Math.random()*mine.length)];
    let before = 0;
    for(let i = 0; i < chosen; i++) before += spinSegs[i].frac;
    const a = (before + spinSegs[chosen].frac*(0.1 + 0.8*Math.random()))*TAU;
    const target = -Math.PI/2 - a;

    const dur = spinDuration()*1000;
    const extra = 3 + Math.round(dur/1000);
    const delta = (((target - rotation) % TAU) + TAU) % TAU + TAU*extra;
    const from = rotation, t0 = performance.now();
    const ease = t => 1 - Math.pow(1-t, 4);
    (function frame(now){
      const t = Math.min(1,(now-t0)/dur);
      rotation = from + delta*ease(t);
      draw();
      if(t < 1) requestAnimationFrame(frame);
      else{ rotation = ((rotation % TAU)+TAU)%TAU; finish(pre); }
    })(t0);
  }

  function finish(pre){
    spinning = false; spinSegs = null;
    $('panel').removeAttribute('inert');
    draw();
    const p = state.prizes.find(x => x.id === winnerId);
    if(!p){ updateSpin(); return; }
    const left = Math.max(0, (pre[p.id]||0) - (state.autoRemove !== false ? 1 : 0));
    $('winName').innerHTML = '<span class="swatch" style="background:'+p.color+'"></span>' + esc(p.name);
    $('winLeft').textContent = state.autoRemove !== false ? left + ' left after this one' : left + ' of this prize in the wheel';
    $('overlay').classList.add('show');
  }

  function closeModal(){
    $('overlay').classList.remove('show');
    draw(); updateSpin();
  }

  /* ---------- saving edits ---------- */
  function cleanConfig(){
    return {
      name: state.name, speed: state.speed, bg: state.bg, txt: state.txt,
      fontScale: state.fontScale || 100, autoRemove: state.autoRemove !== false, equalSlices: !!state.equalSlices,
      prizes: state.prizes.map(p => { const o = {id:p.id, name:p.name, color:p.color, start:p.start||0}; if(p.txt) o.txt = p.txt; return o; })
    };
  }
  const countsObject = () => { const o = {}; state.prizes.forEach(p => { o[p.id] = p.count; }); return o; };
  const cfgRef = () => fb.ref(fb.db, 'wheel/config');
  const countsRef = () => fb.ref(fb.db, 'wheel/counts');
  const dbError = e => setStatus('Couldn’t save to the shared wheel: ' + (e && e.message || e));

  function flushWrite(){
    writeTimer = null;
    if(mode !== 'shared' || !isAdmin) return;
    fb.set(cfgRef(), cleanConfig()).catch(dbError);
  }
  function changed(){
    if(mode === 'shared'){ clearTimeout(writeTimer); writeTimer = setTimeout(flushWrite, 350); }
    else saveLocal();
  }
  function setCountOf(p, v){
    p.count = v; p.start = v;
    if(mode === 'shared'){ fb.set(fb.ref(fb.db, 'wheel/counts/' + p.id), v).catch(dbError); changed(); }
    else saveLocal();
  }
  function pushAll(){                    // after loading a file or seeding
    if(mode === 'shared'){
      clearTimeout(writeTimer); writeTimer = null;
      fb.set(cfgRef(), cleanConfig()).catch(dbError);
      fb.set(countsRef(), countsObject()).catch(dbError);
    }else saveLocal();
  }

  /* ---------- reading the shared wheel ---------- */
  const cnt = id => Math.max(0, Math.floor(Number(remoteCounts[id]) || 0));

  function rebuildFromRemote(){
    const c = remoteCfg;
    if(!c) return;
    const arr = Array.isArray(c.prizes) ? c.prizes : Object.values(c.prizes || {});
    state = {
      name: String(c.name == null ? '' : c.name),
      speed: clampN(c.speed, 1, 10, 6),
      bg: hex(c.bg) || '#ffffff',
      txt: hex(c.txt) || '#ffffff',
      fontScale: clampN(c.fontScale, 50, 200, 100),
      autoRemove: c.autoRemove !== false,
      equalSlices: !!c.equalSlices,
      prizes: arr.filter(Boolean).map((p,i) => ({
        id: String(p.id), name: String(p.name == null ? '' : p.name),
        color: hex(p.color) || PALETTE[i % PALETTE.length], txt: hex(p.txt) || undefined,
        start: Math.max(0, Math.floor(Number(p.start) || 0)), count: cnt(String(p.id))
      }))
    };
  }

  function onCfg(snap){
    gotCfg = true; remoteCfg = snap.val();
    setStatus('');
    if(remoteCfg === null){
      if(isAdmin) maybeSeed(); else setStatus('The organiser hasn’t set up this wheel yet.');
      renderAll(); return;
    }
    if(isAdmin && cfgApplied) return;    // the signed-in admin's page is the source of truth while editing
    rebuildFromRemote(); cfgApplied = true; renderAll();
  }
  function onCounts(snap){
    remoteCounts = snap.val() || {};
    state.prizes.forEach(p => { p.count = cnt(p.id); });
    refreshCounts(); draw(); updateSpin();
  }
  function maybeSeed(){                  // first admin sign-in on an empty database
    if(!(isAdmin && mode === 'shared' && gotCfg && remoteCfg === null)) return;
    state = defaults();
    remoteCfg = cleanConfig(); cfgApplied = true;
    pushAll();
  }

  /* ---------- UI ---------- */
  function titleText(){
    if(mode === 'loading') return 'Loading…';
    if(mode === 'shared' && !remoteCfg) return 'Not set up yet';
    return state.name || 'Spin the Wheel';
  }
  function renderStage(){
    $('title').textContent = titleText();
    document.title = mode === 'loading' ? 'Spin the Wheel' : titleText();
    $('stage').style.background = state.bg;
    const dark = lum(state.bg) > 0.55 ? '#1f2430' : '#ffffff';
    $('title').style.color = dark; $('status').style.color = dark;
  }

  function pctText(p, total){
    return p.count > 0 && total ? (p.count/total*100).toFixed(1) + '% chance per spin' : 'Out of stock';
  }
  function renderPrizes(){
    const total = totalCount();
    $('total').textContent = total + ' prize' + (total===1?'':'s') + ' in the wheel';
    updateSpin();
    const box = $('prizes'); box.innerHTML = '';
    state.prizes.forEach(p => {
      const row = document.createElement('div');
      row.className = 'prize' + (p.count>0 ? '' : ' empty');
      row.dataset.id = p.id;
      row.innerHTML =
        '<input type="color" value="'+p.color+'" title="Slice colour">' +
        '<input type="color" value="'+(p.txt || state.txt)+'" title="Label text colour">' +
        '<input type="text" value="'+esc(p.name)+'" placeholder="Prize name">' +
        '<input type="number" min="0" step="1" value="'+p.count+'" title="Number available">' +
        '<button class="x" title="Delete prize">×</button>' +
        '<div class="pct">'+pctText(p,total)+'</div>';
      const [col, tc, nm, ci, del] = row.querySelectorAll('input,button');
      col.addEventListener('input', () => { p.color = col.value; changed(); draw(); });
      tc.addEventListener('input', () => { p.txt = tc.value; changed(); draw(); });
      nm.addEventListener('input', () => { p.name = nm.value; changed(); draw(); });
      ci.addEventListener('change', () => {
        setCountOf(p, Math.max(0, Math.floor(Number(ci.value) || 0)));
        refreshCounts(); draw(); updateSpin();
      });
      del.addEventListener('click', () => {
        state.prizes = state.prizes.filter(x => x !== p);
        if(mode === 'shared') fb.remove(fb.ref(fb.db, 'wheel/counts/' + p.id)).catch(dbError);
        changed(); renderPrizes(); draw();
      });
      box.appendChild(row);
    });
  }
  // Update the numbers in place (keeps focus while the admin is typing).
  function refreshCounts(){
    const total = totalCount();
    $('total').textContent = total + ' prize' + (total===1?'':'s') + ' in the wheel';
    document.querySelectorAll('#prizes .prize').forEach(row => {
      const p = state.prizes.find(x => x.id === row.dataset.id);
      if(!p) return;
      const num = row.querySelector('input[type=number]');
      if(document.activeElement !== num) num.value = p.count;
      row.querySelector('.pct').textContent = pctText(p, total);
      row.classList.toggle('empty', p.count <= 0);
    });
  }
  function updateSpin(){
    const waiting = mode === 'loading' || (mode === 'shared' && !remoteCfg);
    $('spin').disabled = spinning || waiting || !totalCount();
  }

  function syncInputs(){
    $('name').value = state.name; $('speed').value = state.speed;
    $('bg').value = state.bg; $('txt').value = state.txt;
    $('autoRemove').checked = state.autoRemove !== false;
    $('equalSlices').checked = !!state.equalSlices;
    $('fontScale').value = state.fontScale || 100;
  }
  function renderWho(){
    const w = $('who'); w.innerHTML = '';
    const span = document.createElement('span');
    if(mode === 'shared'){
      span.textContent = 'Shared wheel · ' + ((user && user.email) || 'admin');
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = 'Sign out'; b.addEventListener('click', signOutAdmin);
      w.append(span, b);
    }else{
      span.textContent = notice || 'Local mode: settings are saved on this device only.';
      w.append(span);
    }
  }
  function applyPanel(){
    const show = isAdmin && !uiHide;
    $('app').classList.toggle('nopanel', !show);
    const g = $('gear');
    if(!isAdmin){
      g.classList.add('faint'); g.textContent = '🔒'; g.title = 'Admin sign-in';
    }else{
      g.classList.toggle('faint', uiHide);
      g.textContent = uiHide ? '⚙' : 'Hide settings';
      g.title = uiHide ? 'Show settings' : 'Hide settings so nothing gets changed by accident';
    }
    draw();
  }
  function renderAll(){
    syncInputs(); renderStage(); renderPrizes(); renderWho(); applyPanel(); updateSpin();
  }

  /* ---------- admin sign-in ---------- */
  function openLogin(){
    $('lerr').textContent = ''; $('loginOv').classList.add('show');
    setTimeout(() => $('lemail').focus(), 50);
  }
  function closeLogin(){ $('loginOv').classList.remove('show'); $('lpass').value = ''; }
  function onAuth(u){
    user = u;
    const was = isAdmin;
    isAdmin = !!u;
    closeLogin();
    if(isAdmin) maybeSeed();
    else if(was && remoteCfg){ rebuildFromRemote(); cfgApplied = true; }
    renderAll();
  }
  function signOutAdmin(){
    if(writeTimer){ clearTimeout(writeTimer); flushWrite(); }
    fb.signOut(fb.auth);
  }

  /* ---------- wiring ---------- */
  $('name').addEventListener('input', e => { state.name = e.target.value; changed(); renderStage(); });
  $('speed').addEventListener('input', e => { state.speed = Number(e.target.value); changed(); });
  $('bg').addEventListener('input', e => { state.bg = e.target.value; changed(); renderStage(); });
  $('txt').addEventListener('input', e => {
    state.txt = e.target.value;
    state.prizes.forEach(p => { delete p.txt; });        // "all" resets any per-prize colours
    changed(); renderPrizes(); draw();
  });
  $('fontScale').addEventListener('input', e => { state.fontScale = Number(e.target.value); changed(); draw(); });
  $('autoRemove').addEventListener('change', e => { state.autoRemove = e.target.checked; changed(); });
  $('equalSlices').addEventListener('change', e => { state.equalSlices = e.target.checked; changed(); draw(); });

  $('add').addEventListener('click', () => {
    const p = {id:uid(), name:'New prize', count:1, start:1, color:PALETTE[state.prizes.length % PALETTE.length]};
    state.prizes.push(p);
    if(mode === 'shared') fb.set(fb.ref(fb.db, 'wheel/counts/' + p.id), 1).catch(dbError);
    changed(); renderPrizes(); draw();
  });
  $('shuffle').addEventListener('click', () => {
    const pal = PALETTE.slice().sort(() => Math.random()-.5);
    state.prizes.forEach((p,i) => { p.color = pal[i % pal.length]; });
    changed(); renderPrizes(); draw();
  });
  $('restock').addEventListener('click', () => {
    const o = {};
    state.prizes.forEach(p => { p.count = p.start; o[p.id] = p.start; });
    if(mode === 'shared'){ if(state.prizes.length) fb.update(countsRef(), o).catch(dbError); }
    else saveLocal();
    renderPrizes(); draw();
  });

  function msg(t){ $('fileMsg').textContent = t; }
  $('saveFile').addEventListener('click', () => {
    const data = JSON.stringify({app:'spin-the-wheel', version:1, ...state}, null, 2);
    const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    const a = document.createElement('a');
    const safe = (state.name || 'wheel').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-') || 'wheel';
    a.href = url; a.download = safe + '.wheel.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    msg('Saved as ' + a.download + ' (check your Downloads folder).');
  });
  $('loadFile').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const s = JSON.parse(reader.result);
        if(!s || !Array.isArray(s.prizes)) throw new Error('bad');
        state = {
          name: String(s.name ?? 'G.R.O.S.S.'),
          speed: clampN(s.speed, 1, 10, 6),
          bg: hex(s.bg) || '#ffffff',
          txt: hex(s.txt) || '#ffffff',
          autoRemove: s.autoRemove !== false,
          equalSlices: !!s.equalSlices,
          fontScale: clampN(s.fontScale, 50, 200, 100),
          prizes: s.prizes.map((p,i) => {
            const count = Math.max(0, Math.floor(Number(p.count) || 0));
            const start = Math.max(0, Math.floor(Number(p.start ?? p.count) || 0));
            const item = {id:uid(), name:String(p.name ?? 'Prize'), count, start, color: hex(p.color) || PALETTE[i % PALETTE.length]};
            if(hex(p.txt)) item.txt = hex(p.txt);
            return item;
          })
        };
        rotation = 0; pushAll(); renderAll();
        msg('Loaded "' + state.name + '".');
      }catch(err){
        msg('That file isn’t a valid wheel file.');
      }
    };
    reader.readAsText(file);
  });

  $('spin').addEventListener('click', spin);
  $('keep').addEventListener('click', closeModal);
  $('gear').addEventListener('click', () => {
    if(!isAdmin){ openLogin(); return; }
    uiHide = !uiHide; saveUI(); applyPanel();
  });
  $('lcancel').addEventListener('click', closeLogin);
  $('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    $('lerr').textContent = 'Signing in…';
    fb.signIn(fb.auth, $('lemail').value.trim(), $('lpass').value)
      .catch(() => { $('lerr').textContent = 'Sign-in failed. Check the email and password.'; });
  });
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if($('overlay').classList.contains('show')) closeModal();
    if($('loginOv').classList.contains('show')) closeLogin();
  });
  window.addEventListener('resize', draw);

  /* ---------- start up ---------- */
  function goLocal(why){
    mode = 'local'; isAdmin = true; notice = why || '';
    state = loadLocal() || defaults();
    if(why) setStatus(why);
    renderAll();
  }
  async function initFirebase(){
    const base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
    const [A, D, U] = await Promise.all([
      import(base + 'firebase-app.js'), import(base + 'firebase-database.js'), import(base + 'firebase-auth.js')
    ]);
    const app = A.initializeApp(FB_CONFIG);
    fb = {
      db: D.getDatabase(app), auth: U.getAuth(app),
      ref: D.ref, set: D.set, update: D.update, remove: D.remove, onValue: D.onValue, runTransaction: D.runTransaction,
      signIn: U.signInWithEmailAndPassword, signOut: U.signOut, onAuthStateChanged: U.onAuthStateChanged
    };
  }

  (async function boot(){
    loadUI();
    renderAll();
    if(!USE_FIREBASE){ goLocal(); return; }
    setStatus('Connecting…');
    try{ await initFirebase(); }
    catch(e){
      console.warn(e);
      goLocal('Couldn’t reach the shared database, so this wheel is running on this device only.');
      return;
    }
    mode = 'shared';
    fb.onAuthStateChanged(fb.auth, onAuth);
    fb.onValue(cfgRef(), onCfg, e => { setStatus('Couldn’t read the shared wheel: ' + e.message); });
    fb.onValue(countsRef(), onCounts, () => {});
    setTimeout(() => { if(!gotCfg) setStatus('Still connecting… please check your internet connection.'); }, 10000);
    renderAll();
  })();
})();
</script>
</body>
</html>
